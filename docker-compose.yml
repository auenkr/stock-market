services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_market
      POSTGRES_USER: stock_market
      POSTGRES_PASSWORD: stock_market
    ports:
      - "5432:5432"
    volumes:
      - stock-market-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_market -d stock_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stock-market-postgres:
