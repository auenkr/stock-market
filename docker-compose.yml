services:
  api:
    build: apps/api-rs
    restart: unless-stopped
    ports: ["8787:3000"]
    environment:
      ENVIRONMENT: dev
      VALKEY_URL: redis://valkey:6379
      SOURCE_USERNAME: ${SOURCE_USERNAME:-}
      SOURCE_PASSWORD: ${SOURCE_PASSWORD:-}
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
