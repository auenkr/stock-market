name: Build and publish Rust API image

on:
  push:
    branches: [main]
    paths:
      - apps/api-rs/**
      - .github/workflows/build-api-image.yml
  pull_request:
    branches: [main]
    paths:
      - apps/api-rs/**
      - .github/workflows/build-api-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: auenkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: auenkr/stock-market-api-rs
          tags: |
            type=raw,value=main-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-rs
          file: ./apps/api-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
