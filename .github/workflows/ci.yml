name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_DAEMON: "false"
  NX_SKIP_NX_CACHE: "true"
  ENVIRONMENT: dev

jobs:
  promotion:
    name: Dev promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Require the tested dev deployment before promotion
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.head.ref !== 'dev' || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Promote changes through a dev → main pull request.');
              return;
            }
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, sha: pr.head.sha, environment: 'development', per_page: 100,
            });
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 1,
              });
              if (statuses[0]?.state === 'success') return;
            }
            core.setFailed('This dev commit must pass Deploy development (including live smoke checks) before merging. Re-run this check after deployment completes.');

  tests:
    name: Rust, MCP and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
