name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_DAEMON: "false"
  NX_SKIP_NX_CACHE: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TEST_MODE: CICD
  ENVIRONMENT: dev
  BETTER_AUTH_SECRET: ci-auth-secret-for-isolated-tests-only
  API_KEY_ENCRYPTION_SECRET: ci-key-secret-for-isolated-tests-only

jobs:
  promotion:
    name: Dev promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Require the tested dev deployment before promotion
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.head.ref !== 'dev' || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Promote changes through a dev → main pull request.');
              return;
            }
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, sha: pr.head.sha, environment: 'development', per_page: 100,
            });
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deployment.id, per_page: 1,
              });
              if (statuses[0]?.state === 'success') return;
            }
            core.setFailed('This dev commit must pass Deploy development (including live smoke checks) before merging. Re-run this check after deployment completes.');

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stock_test
          POSTGRES_PASSWORD: stock_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stock_test:stock_test@127.0.0.1:5432/postgres
    steps:
      # Default checkout tests GitHub's PR merge commit, including the base branch.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create fixture environment and install tmux
        run: |
          cp sample.env .env
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Install Chromium and browser dependencies
        run: pnpm --filter @stock-market/web exec playwright install --with-deps chromium
      - name: Docs, types, API, auth, keys, integration and browser E2E
        run: pnpm test:ci
      - name: MCP protocol tests
        run: pnpm --filter @auenkr/legerline-mcp exec node --import tsx --test tests/mcp.test.ts tests/worker.test.ts
      - name: Integration and performance test types
        run: pnpm exec tsc -p apps/api/tests/tsconfig.json --noEmit
      - name: Production documentation and theme browser tests
        env:
          ENVIRONMENT: production
        run: pnpm --filter @stock-market/web exec playwright test tests/browser/theme.spec.ts tests/browser/api-explorer.spec.ts --output=test-results/production
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.0.0"
      - name: Performance smoke
        run: pnpm test:performance
      - name: Shared account quota performance
        env:
          SCENARIO: quota
        run: pnpm test:performance
      - name: Upload browser traces and performance summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/api/tests/performance/results/
          if-no-files-found: ignore
          retention-days: 7

  rust-contract:
    name: Rust API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stock_test
          POSTGRES_PASSWORD: stock_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION_URL: postgresql://stock_test:stock_test@127.0.0.1:5432/postgres
      CONTRACT_DATABASE_URL: postgresql://stock_test:stock_test@127.0.0.1:5432/postgres
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build database package and migrate contract database
        run: |
          pnpm --filter @stock-market/db build
          pnpm --filter @stock-market/web exec drizzle-kit push --force
          node packages/db/scripts/migrate-all.mjs
      - name: Run Rust API HTTP contract suite
        run: pnpm test:contract:rust

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create build fixture environment
        run: cp sample.env .env
      - name: Build every workspace project
        run: pnpm build
      - name: Build MCP Cloudflare Worker
        run: pnpm --filter @auenkr/legerline-mcp build:worker
