name: Publish main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  CI: 'true'
  NX_DAEMON: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:clients:check
      - run: pnpm test:ci

  docker:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: auenkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: auenkr/stock-market-api-rs
          tags: |
            type=raw,value=main-latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api-rs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [apps/mcp, apps/legerline-cli]
    env:
      PACKAGE_DIRECTORY: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build bundled package
        run: pnpm --recursive --filter "{./$PACKAGE_DIRECTORY}..." run build
      - run: node scripts/prepare-publish-package.mjs
      - name: Assign unique main release version
        working-directory: ${{ matrix.directory }}
        run: pnpm version "$(node -p 'require("./package.json").version')-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version
      - name: Publish npm package
        working-directory: ${{ matrix.directory }}
        run: pnpm publish --access public --tag latest --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
