name: Deploy development

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy and smoke-test development
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: development
      url: https://stock-market-web-dev.vercel.app
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy dev web project
        run: pnpm dlx vercel@50.18.0 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Build API workspace dependencies
        run: pnpm --filter '@stock-market/api^...' build
      - name: Deploy dev API and custom domain
        run: pnpm --filter @stock-market/api deploy:dev
      - name: Deploy dev MCP and custom domain
        run: pnpm --filter @auenkr/legerline-mcp deploy:dev
      - name: Verify deployed service wiring
        run: node scripts/smoke-dev.mjs
