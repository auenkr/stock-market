name: Deploy development

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  changed-packages:
    name: Detect changed npm packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.changed.outputs.cli }}
      mcp: ${{ steps.changed.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify changed package sources
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          if grep -q '^apps/legerline-cli/' <<< "$files"; then
            echo 'cli=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cli=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^apps/mcp/' <<< "$files"; then
            echo 'mcp=true' >> "$GITHUB_OUTPUT"
          else
            echo 'mcp=false' >> "$GITHUB_OUTPUT"
          fi

  validate:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy and smoke-test development
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: development
      url: https://stock-market-web-dev.vercel.app
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy dev web project
        run: pnpm dlx vercel@50.18.0 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Build API workspace dependencies
        run: pnpm --filter '@stock-market/api^...' build
      - name: Deploy dev API and custom domain
        run: pnpm --filter @stock-market/api deploy:dev
      - name: Deploy dev MCP and custom domain
        run: pnpm --filter @auenkr/legerline-mcp deploy:dev
      - name: Verify deployed service wiring
        run: node scripts/smoke-dev.mjs

  npm-dev:
    name: Publish changed development packages
    needs: [changed-packages, validate]
    if: needs.changed-packages.outputs.cli == 'true' || needs.changed-packages.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE_VERSION_SUFFIX: dev.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build CLI package and prepare dev identity
        if: needs.changed-packages.outputs.cli == 'true'
        env:
          PACKAGE_DIRECTORY: apps/legerline-cli
          PACKAGE_NAME: '@auenkr/legerline-cli-dev'
          SOURCE_PACKAGE: '@auenkr/legerline-cli'
        run: |
          pnpm --filter "$SOURCE_PACKAGE"... build
          version=$(node -p "require('./' + process.env.PACKAGE_DIRECTORY + '/package.json').version")
          pnpm --dir "$PACKAGE_DIRECTORY" pkg set "name=$PACKAGE_NAME" "version=$version-$PACKAGE_VERSION_SUFFIX"
      - name: Publish CLI development package
        if: needs.changed-packages.outputs.cli == 'true'
        working-directory: apps/legerline-cli
        run: pnpm publish --access public --tag dev --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build MCP package and prepare dev identity
        if: needs.changed-packages.outputs.mcp == 'true'
        env:
          PACKAGE_DIRECTORY: apps/mcp
          PACKAGE_NAME: '@auenkr/legerline-mcp-dev'
          SOURCE_PACKAGE: '@auenkr/legerline-mcp'
        run: |
          pnpm --filter "$SOURCE_PACKAGE"... build
          version=$(node -p "require('./' + process.env.PACKAGE_DIRECTORY + '/package.json').version")
          pnpm --dir "$PACKAGE_DIRECTORY" pkg set "name=$PACKAGE_NAME" "version=$version-$PACKAGE_VERSION_SUFFIX"
      - name: Publish MCP development package
        if: needs.changed-packages.outputs.mcp == 'true'
        working-directory: apps/mcp
        run: pnpm publish --access public --tag dev --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
